# Signal Dictionary — maps abstract signal names to concrete CAN/LIN identifiers.
#
# Each signal used in the action library and test artifacts is defined here with
# its physical-layer addressing, scaling, unit, and valid range. The mapper uses
# this to generate bench-specific signal access code.
#
# Structure mirrors a simplified DBC/ARXML signal definition:
#   <abstract_name>:
#     can_id: CAN message arbitration ID (hex)
#     bus: bus name from bench_boundary.yaml
#     start_bit: signal start bit in the CAN frame
#     length: signal bit length
#     factor: raw-to-physical scaling factor
#     offset: raw-to-physical offset
#     unit: physical unit
#     min/max: valid physical range
#     ecu: source ECU

vehicle_speed_kph:
  can_id: 0x1A0
  bus: CAN_HS_1
  start_bit: 0
  length: 16
  factor: 0.01
  offset: 0
  unit: "kph"
  min: 0
  max: 300
  ecu: Brake_ECU

